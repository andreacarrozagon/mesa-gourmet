<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Iniciar sesión | Mesa Gourmet</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">

  <link rel="stylesheet" href="estilos.css">

  <!-- Única referencia al archivo de validación -->
  <script src="validaciones.js" defer></script>
</head>

<body>
  <header class="encabezado text-center">
    <div class="container">
      <p class="marca">MESA GOURMET</p>
      <p class="mb-0">Accede a tu cuenta</p>
    </div>
  </header>

  <nav class="navbar bg-white border-bottom"
       aria-label="Navegación de acceso">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        Mesa Gourmet
      </a>

      <a href="index.html" class="nav-link">
        Volver al inicio
      </a>
    </div>
  </nav>

  <main class="container py-5">
    <section class="panel-login"
             aria-labelledby="tituloLogin">

      <h1 id="tituloLogin" class="h2 text-center mb-3">
        Iniciar sesión
      </h1>

      <p class="text-center text-secondary mb-4">
        Ingresa para gestionar tu carrito y consultar tus pedidos.
      </p>

      <form
        id="formLogin"
        action="procesar_login.php"
        method="post"
        novalidate>

        <div class="mb-3">
          <label for="email" class="form-label">
            Correo electrónico
          </label>

          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="nombre@ejemplo.cl"
            autocomplete="username"
            maxlength="190"
            aria-describedby="email-error"
            required>

          <div
            id="email-error"
            class="invalid-feedback"
            aria-live="polite">
          </div>
        </div>

        <div class="mb-4">
          <label for="contrasena" class="form-label">
            Contraseña
          </label>

          <input
            type="password"
            id="contrasena"
            name="contrasena"
            class="form-control"
            autocomplete="current-password"
            aria-describedby="ayudaContrasena contrasena-error"
            required>

          <div id="ayudaContrasena" class="form-text">
            Mínimo 10 caracteres, con mayúscula, minúscula,
            número y símbolo.
          </div>

          <div
            id="contrasena-error"
            class="invalid-feedback"
            aria-live="polite">
          </div>
        </div>

        <button type="submit" class="btn btn-gourmet w-100">
          Ingresar
        </button>

        <p id="estadoFormulario"
           class="mt-3 mb-0"
           role="status"
           aria-live="polite">
        </p>
      </form>

      <p class="text-center mt-4 mb-0">
        ¿No tienes cuenta?
        <a href="registro.php">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <footer class="pie-pagina text-center">
    <p class="mb-0">
      Mesa Gourmet · Proyecto académico
    </p>
  </footer>
</body>
</html>
